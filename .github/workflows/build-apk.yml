name: Build Tyn Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Install dependencies
        run: npm ci

      - name: Build Next.js static export for Capacitor
        run: npm run build:cap

      - name: Sync Capacitor Android project
        run: npx cap sync android

      - name: Build Android APK
        working-directory: android
        env:
          TYN_VERSION_CODE: ${{ github.run_number }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -e
          mkdir -p ../dist
          if [ -n "${ANDROID_HOME:-}" ] && [ -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
          fi
          chmod +x gradlew

          if [ -n "$ANDROID_KEYSTORE_BASE64" ] && [ -n "$ANDROID_KEY_ALIAS" ] && [ -n "$ANDROID_STORE_PASSWORD" ] && [ -n "$ANDROID_KEY_PASSWORD" ]; then
            KEYSTORE_FILE="$RUNNER_TEMP/tyn-release.jks"
            trap 'rm -f "$KEYSTORE_FILE"' EXIT
            printf '%s' "$ANDROID_KEYSTORE_BASE64" | tr -d '\r\n ' | base64 -d > "$KEYSTORE_FILE"
            export ANDROID_KEYSTORE_PATH="$KEYSTORE_FILE"
            echo "Building signed Release APK (versionCode=$TYN_VERSION_CODE)..."
            ./gradlew assembleRelease --no-daemon
            cp app/build/outputs/apk/release/app-release.apk ../dist/Tyn.apk
          else
            echo "::warning::Release signing secrets not configured; falling back to debug APK."
            ./gradlew assembleDebug --no-daemon
            cp app/build/outputs/apk/debug/app-debug.apk ../dist/Tyn.apk
          fi

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Tyn-Android-APK
          path: dist/Tyn.apk
          retention-days: 30

      - name: Publish rolling APK to GitHub Releases
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if ! gh release view apk-latest > /dev/null 2>&1; then
            gh release create apk-latest \
              --title "Tyn Android APK (Latest)" \
              --notes "Automated Capacitor Android build of Tyn with native AlarmManager notifications." \
              --prerelease
          fi
          gh release upload apk-latest dist/Tyn.apk --clobber

